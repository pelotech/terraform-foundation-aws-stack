name: pre-commit
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read

# One run per PR branch: a new push supersedes the in-flight run. head_ref is only set on
# pull_request, so ref keeps push runs in their own group. Pushes to main are never cancelled —
# each merge commit keeps its own completed run rather than being killed by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          # Do not leave the token in .git/config; untrusted PR hooks run in
          # later steps. Write-back uses the GitHub API with GH_TOKEN instead.
          persist-credentials: false
      - name: install pre-commit
        run: pip install pre-commit

      # NOTE: deliberately NOT Renovate-annotated. This is pinned to the required_version floor in
      # versions.tf so CI proves that constraint is honest; auto-bumping it would silently stop
      # testing the floor. Raise it by hand when versions.tf changes.
      - name: Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.0"

      - name: install hcledit
        env:
          # renovate: datasource=github-releases depName=minamijoyo/hcledit
          HCLEDIT_VERSION: 0.2.18
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          curl -sSLo "$tmpdir/hcledit.tar.gz" "https://github.com/minamijoyo/hcledit/releases/download/v${HCLEDIT_VERSION}/hcledit_${HCLEDIT_VERSION}_linux_amd64.tar.gz"
          tar -xzf "$tmpdir/hcledit.tar.gz" -C "$tmpdir"
          chmod +x "$tmpdir/hcledit"
          sudo mv "$tmpdir/hcledit" /usr/local/bin/hcledit

      # The official action rather than piping install_linux.sh into bash: this job later mints a
      # write-capable app token. Note that pinning the *script* URL to a tag would not have helped
      # — install_linux.sh resolves the tool version at runtime from the GitHub API unless
      # TFLINT_VERSION is set, so a versioned script URL pins the script and not the binary.
      - name: install tf-lint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          tflint_version: v0.59.1
          # Caches the plugin dir keyed on .tflint.hcl; the terraform ruleset is otherwise
          # re-downloaded on every run.
          cache: true

      - name: install tf-docs
        env:
          # renovate: datasource=github-releases depName=terraform-docs/terraform-docs
          TERRAFORM_DOCS_VERSION: v0.24.0
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          curl -sSLo "$tmpdir/terraform-docs.tar.gz" "https://terraform-docs.io/dl/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf "$tmpdir/terraform-docs.tar.gz" -C "$tmpdir"
          chmod +x "$tmpdir/terraform-docs"
          sudo mv "$tmpdir/terraform-docs" /usr/local/bin/terraform-docs

      # The version input is not a `uses:` ref, so Renovate's github-actions manager cannot see it.
      # Without the annotation below the pinned binary — and with --skip-check-update, its embedded
      # check database — never advances.
      - name: install trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.73.0

      - name: Regenerate docs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: pre-commit run terraform_docs --all-files || true

      - name: Check for docs changes
        id: docs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- ':(glob)**/README.md'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs before pre-commit so a formatting nit cannot short-circuit the job and hide a real
      # test regression. Uses mock_provider throughout, so it needs no credentials and touches no
      # state; -backend=false keeps init local.
      - name: terraform test
        run: |
          set -euo pipefail
          for dir in . modules/cni-bootstrap; do
            echo "::group::terraform test ($dir)"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" test -no-color
            echo "::endgroup::"
          done

      # Runs on every event and is the required status check. On the docs commit
      # (run #2) this re-runs and lands a green check on the head SHA. Untrusted
      # hooks run here, BEFORE any write-capable token exists.
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Generate app token
        id: app-token
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.docs.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.ORG_RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.ORG_RELEASE_PLEASE_PRIVATE_KEY }}

      - name: Commit docs changes back to PR branch (signed)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.docs.outputs.changed == 'true'
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: "docs: regenerate docs"
          repo: ${{ github.repository }}
          branch: ${{ github.head_ref }}
          file_pattern: ':(glob)**/README.md'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
